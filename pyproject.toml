[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvtypedesc"
version = "1.0.0"
description = "Parse LabVIEW type descriptors into a typed tree, render them, and write them back"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["labview", "type descriptor", "type string", "variant", "flatten", "ni", "binary", "parser"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine", "hatchling", "editables"]

[project.scripts]
lvtypedesc = "lvtypedesc._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/lvtypedesc"
Issues = "https://github.com/JaviLianes8/lvtypedesc/issues"
Changelog = "https://github.com/JaviLianes8/lvtypedesc/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/lvtypedesc"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "GUIDE.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
    "requirements-dev.txt",
]
exclude = ["tests/fixtures/sources/ni-*", "tests/fixtures/sources/labviewwiki-*", "**/__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
